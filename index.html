<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MealPlanner — 21-day plans</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5c6b50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MealPlanner">
<style>
:root{
  --bg:#f7f4ee; --fg:#2b2a26; --mut:#6d6a61; --line:#e3ddd1;
  --card:#fffcf6; --card2:#f1ece1; --accent:#5c6b50; --accent-soft:#e6e3d3;
  --on-accent:#fffcf6; --danger:#a04b3a;
}
body[data-plan="animal"]{
  --bg:#faf6f1; --fg:#2a2620; --mut:#756b5d; --line:#e8dfd2;
  --card:#fffdf8; --card2:#f3ece1; --accent:#8a3b2e; --accent-soft:#f0e2da;
  --on-accent:#fffdf8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  transition:background .25s}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}

/* ---------- masthead ---------- */
.mast{padding:34px 0 18px}
.mast .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
.mast h1{font-size:clamp(28px,4.6vw,44px);line-height:1.05;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
.mast .lede{color:var(--mut);max-width:64ch;font-size:15.5px;margin:0}

/* ---------- sticky toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-top)*0)}
.toolbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.seg button{font:600 13.5px/1 inherit;padding:9px 13px;border:none;background:transparent;
  color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.toolbar .spacer{flex:1}
.bulk{display:flex;gap:6px}
.bulk button{font:600 12.5px/1 inherit;padding:8px 11px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--mut)}
.bulk button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- day grid ---------- */
.day{margin:20px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.day-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card2);
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.day-head .dn{font-family:Georgia,serif;font-size:19px;font-weight:600}
.day-head .dc{color:var(--mut);font-size:13px}
.day-head .dtoggle{margin-left:auto;font:600 12.5px/1 inherit;color:var(--accent);
  border:1px solid var(--line);background:var(--card);padding:7px 11px;border-radius:9px;cursor:pointer}
.day-cols{display:grid;grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.day-cols{grid-template-columns:1fr}}
.meal{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:9px;
  cursor:pointer;position:relative;transition:opacity .18s}
.meal:last-child{border-right:none}
@media(max-width:860px){.meal{border-right:none;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:none}}
.meal .slot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.meal h3{font-size:17.5px;margin:1px 0 0;line-height:1.25;font-weight:600}
.meal .tag{color:var(--mut);font-size:13px;margin:0}
.meal.out{opacity:.38}
.meal.out::after{content:"excluded";position:absolute;top:12px;right:12px;font:700 10.5px/1 inherit;
  letter-spacing:.08em;text-transform:uppercase;color:var(--danger);
  border:1px solid currentColor;border-radius:999px;padding:4px 8px;background:var(--card)}
.meal .ring{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;
  border:2px solid var(--line);background:var(--card)}
.meal .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);
  opacity:0;transform:scale(.4);transition:all .18s}
.meal:not(.out) .ring::after{opacity:1;transform:scale(1)}
.ing{padding:0;margin:0;list-style:none}
.ing li{font-size:13px;line-height:1.45;display:flex;gap:7px;align-items:baseline}
.ing .nm{color:var(--mut)}
.ing .amt{color:var(--fg);font-weight:600;white-space:nowrap;margin-left:auto}
details.recipe{border-top:1px dashed var(--line);padding-top:8px}
details.recipe summary{font:600 12.5px/1 inherit;color:var(--accent);cursor:pointer;list-style:none}
details.recipe summary::-webkit-details-marker{display:none}
details.recipe .m{font-size:13px;color:var(--mut);margin:8px 0 0}
.supps{font-size:12px;background:var(--accent-soft);border-radius:8px;padding:6px 8px}
.note{font-size:12px;color:var(--mut);font-style:italic;margin:0}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(0,0,0,.07);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.bottombar .row{display:flex;align-items:center;gap:12px}
.bottombar .cnt{color:var(--mut);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:600 14px/1 inherit;padding:12px 18px;border-radius:11px;border:none;cursor:pointer;
  background:var(--accent);color:var(--on-accent);white-space:nowrap}
.tabbtn{font:600 13.5px/1 inherit;padding:9px 14px;border-radius:11px;border:1px solid var(--accent);
  background:var(--card);color:var(--accent);cursor:pointer}
.tabbtn:hover{background:var(--accent);color:var(--on-accent)}
.sgroup{margin:16px 0 4px;font-weight:700;font-size:12.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent)}
.srow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow .dose{color:var(--mut);margin-left:auto;white-space:nowrap;font-weight:600}
.srow .when{color:var(--mut)}
.srow .why{color:var(--mut);font-style:italic}
.snote{font-size:13px;color:var(--mut);margin:14px 0 0;line-height:1.5}
.badge{display:inline-block;font:700 10px/1 inherit;letter-spacing:.08em;text-transform:uppercase;
  border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:middle}
.badge.daily{background:var(--accent-soft);color:var(--accent)}
.badge.phase{background:transparent;color:var(--mut);border:1px solid var(--line)}
.srow{cursor:pointer}
.srow .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;
  position:relative;top:3px}
.srow.done .tick{border-color:var(--accent);background:var(--accent)}
.srow.done .nm{opacity:.5;text-decoration:line-through}
.srow.phaserow{cursor:default;opacity:.62}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}

/* ---------- overlay sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.5);display:none;z-index:40;
  align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:780px;max-height:90vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:24px 26px 34px;
  padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:22px;margin:0}
.sheet .x{font-size:26px;line-height:1;background:none;border:none;cursor:pointer;color:var(--mut);padding:4px 8px}
.sheet .sub{color:var(--mut);font-size:13.5px;margin:4px 0 14px}
.sheet .cat{margin:16px 0 4px;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sheet .ritem{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sheet .ritem .rq{color:var(--mut);margin-left:auto;white-space:nowrap}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--fg);color:var(--bg);font:600 13.5px/1 inherit;padding:11px 16px;border-radius:10px;
  opacity:0;pointer-events:none;transition:all .22s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{padding:30px 0 20px;color:var(--mut);font-size:12.5px;text-align:center}
@media print{.toolbar,.bottombar,.toast,.overlay{display:none!important}body{padding:0}}
</style>
</head>
<body data-plan="healing">

<div class="wrap mast">
  <p class="kicker" id="mKicker">Meal planner · 21 days</p>
  <h1 id="mName">MealPlanner</h1>
  <p class="lede" id="mLede"></p>
</div>

<div class="toolbar"><div class="wrap toolbar-row">
  <div class="seg" id="planSeg" role="tablist" aria-label="Meal plan"></div>
  <div class="seg" id="weekSeg" aria-label="Week"></div>
  <button class="tabbtn" id="suppBtn" style="display:none">Supplements</button>
  <button class="tabbtn" id="routBtn">Routines</button>
  <a class="tabbtn" id="pinBtn" href="https://pin.it/3SK77URPL" target="_blank" rel="noopener">&#128086; Mood board</a>
  <span class="spacer"></span>
  <div class="bulk">
    <button id="bAll" title="Include every meal this week">All</button>
    <button id="bNone" title="Exclude every meal this week">None</button>
    <button id="bReset" title="Back to all-on">Reset</button>
  </div>
</div></div>

<div class="wrap" id="days"></div>

<footer><div class="wrap">
  On iPhone: open this page in Safari → Share → “Add to Home Screen” for a one-tap app icon.
  Sources: George Ferman vault gut-health meal plans. Not medical advice.
</div></footer>

<div class="bottombar"><div class="wrap row">
  <div class="cnt" id="cnt"></div>
  <button class="btn ghost" id="bShare" style="display:none">Share…</button>
  <button class="btn ghost" id="bSend">Send to phone</button>
  <button class="btn" id="bList">Shopping list</button>
</div></div>

<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-label="Shopping list">
  <div class="head"><h2 id="shTitle">Shopping list</h2><button class="x" id="shX">×</button></div>
  <p class="sub" id="shSub"></p>
  <div id="shList"></div>
  <div class="actions">
    <button class="btn" id="shCopy">Copy as text</button>
    <button class="btn ghost" id="shPrint">Print</button>
    <button class="btn ghost" id="shShare" style="display:none">Share…</button>
    <button class="btn ghost" id="shSend">Send to phone</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script src="meals-data.js"></script>
<script>
"use strict";
var LS="mealplanner-v2";
var state={plan:"healing",week:0,incl:{}};
try{var s=JSON.parse(localStorage.getItem(LS));if(s&&s.plan)state=s;}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}

var PLANS=window.MEAL_DATA.plans;
var CAT_LABEL={"protein":"Protein","vet":"Vegetables","fruit":"Fruit","carbs":"Carbs & Grains","fats":"Good fats","pantry":"Pantry","drinks":"Broths & Drinkables","herbs":"Herbs & Seasoning","dairy":"Dairy"};
var CAT_ORDER=["protein","vet","fruit","carbs","fats","pantry","drinks","dairy","herbs"];
var WN=["Week 1","Week 2","Week 3"], DN=["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6","Day 7"],
    SL=["Breakfast","Lunch","Dinner"];
var PHONE_URL="http://MB13ES.local:8765";

function P(){return PLANS.filter(function(p){return p.id===state.plan;})[0]||PLANS[0];}
function key(){var p=P();return p.id+"|"+state.week;}
function inclArr(){
  if(!state.incl[key()]){
    var w=P().weeks[state.week], a=[];for(var i=0;i<w.length*3;i++)a.push(true);
    state.incl[key()]=a;
  }
  return state.incl[key()];
}
function q(s){return document.querySelector(s);}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){
  return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function toast(msg){var t=q("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},1900);}

/* ---------- render ---------- */
function applyTheme(){
  document.body.dataset.plan=state.plan;
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.content=state.plan==="animal"?"#8a3b2e":"#5c6b50";
}
function renderPlanSeg(){
  q("#planSeg").innerHTML=PLANS.map(function(p){
    return '<button role="tab" data-p="'+p.id+'" class="'+(p.id===state.plan?"on":"")
      +'">'+esc(p.short)+'</button>';}).join("");
  q("#planSeg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){state.plan=b.dataset.p;state.week=0;save();
      applyTheme();renderAll();};});
}
function renderWeekSeg(){
  q("#weekSeg").innerHTML=WN.map(function(w,i){
    return '<button data-w="'+i+'" class="'+(i===state.week?"on":"")+'">'+w+'</button>';}).join("");
  q("#weekSeg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){state.week=+b.dataset.w;save();renderAll();};});
}
function ingRow(g){
  // g = [name, amount, emoji, category]
  return '<li><span>'+(g[2]||"•")+'</span><span class="nm">'+esc(g[0])+
    '</span><span class="amt">'+esc(g[1])+'</span></li>';
}
function renderDays(){
  var p=P(), week=p.weeks[state.week], html="";
  week.forEach(function(day,di){
    var inc=inclArr(), n=0;
    for(var s=0;s<3;s++) if(inc[di*3+s]) n++;
    var cells=day.map(function(meal,si){
      var mi=di*3+si, out=!inc[mi];
      return '<div class="meal'+(out?" out":"")+'" data-mi="'+mi+'" role="switch" aria-checked="'+(!out)+'" tabindex="0">'
        +'<span class="ring"></span>'
        +'<div class="slot">'+SL[si]+'</div>'
        +'<h3>'+esc(meal.name)+'</h3>'
        +'<p class="tag">'+esc(meal.tag)+'</p>'
        +'<ul class="ing">'+meal.ingredients.map(ingRow).join("")+'</ul>'
        +(meal.note?'<p class="note">'+esc(meal.note)+'</p>':'')
        +(meal.supps?'<div class="supps">Supps: '+esc(meal.supps)+'</div>':'')
        +'<details class="recipe" onclick="event.stopPropagation()"><summary>Method</summary>'
        +'<p class="m">'+esc(meal.method)+'</p></details>'
        +'</div>';
    }).join("");
    html+='<div class="day" id="day'+di+'"><div class="day-head" data-di="'+di+'" title="Tap to include/exclude the whole day">'
      +'<span class="dn">'+DN[di]+'</span><span class="dc">'+n+'/3 meals</span>'
      +'<span class="dtoggle">'+(n===3?"Exclude day":n===0?"Include day":"Toggle day")+'</span></div>'
      +'<div class="day-cols">'+cells+'</div></div>';
  });
  q("#days").innerHTML=html;

  q("#days").querySelectorAll(".meal").forEach(function(el){
    var toggle=function(){
      var mi=+el.dataset.mi, a=inclArr();a[mi]=!a[mi];save();
      el.classList.toggle("out",!a[mi]);
      el.setAttribute("aria-checked",String(!!a[mi]));
      updateCounts();
      // refresh day-count labels without full re-render
      var di=Math.floor(mi/3), n=0;for(var s=0;s<3;s++)if(a[di*3+s])n++;
      var head=q("#day"+di+" .dc");if(head)head.textContent=n+"/3 meals";
      var tg=q("#day"+di+" .dtoggle");
      if(tg)tg.textContent=(n===3?"Exclude day":n===0?"Include day":"Toggle day");
    };
    el.onclick=toggle;
    el.onkeydown=function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle();}};
  });
  q("#days").querySelectorAll(".day-head").forEach(function(h){
    h.onclick=function(){
      var di=+h.dataset.di,a=inclArr(),on=0;
      for(var s=0;s<3;s++)if(a[di*3+s])on++;
      var target=on>=3?false:true;   // full day -> exclude, else include all
      for(var s2=0;s2<3;s2++)a[di*3+s2]=target;
      save();renderDays();updateCounts();
    };
  });
}
function updateCounts(){
  var p=P(),inc=inclArr(),n=0;inc.forEach(function(v){if(v)n++;});
  q("#cnt").textContent=n+" of "+inc.length+" meals in "+WN[state.week]+" · "+p.short;
  q("#bList").textContent="Shopping list ("+n+")";
}
function renderMast(){
  var p=P();
  q("#suppBtn").style.display=(p.suppGuide&&p.suppGuide.length)?"":"none";
  q("#mKicker").textContent=p.kicker;
  q("#mName").textContent=p.name;
  q("#mLede").innerHTML=p.lede;
  q("#shTitle").textContent=p.shopTitle;
}
function renderAll(){applyTheme();renderMast();renderPlanSeg();renderWeekSeg();renderDays();updateCounts();}

/* ---------- aggregation ---------- */
function iconForItem(it){
  // find the emoji from any meal's ingredient list by name
  var p=P(), week=p.weeks[state.week];
  for(var mi=0; mi<week.length*3; mi++){
    if(!inclArr()[mi]) continue;
    var meal=week[Math.floor(mi/3)][mi%3];
    for(var g=0; g<meal.ingredients.length; g++){
      if(meal.ingredients[g][0]===it.name) return meal.ingredients[g][2]||"•";
    }
  }
  return "•";
}

function aggregate(){
  var p=P(),week=p.weeks[state.week],inc=inclArr(),counts={};
  inc.forEach(function(v,mi){
    if(!v)return;
    var meal=week[Math.floor(mi/3)][mi%3];
    meal.ingredients.forEach(function(g){
      var k=g[3]+"|"+g[0];
      if(!counts[k])counts[k]={name:g[0],amt:g[1],cat:g[3],times:0};
      counts[k].times++;
    });
  });
  var list=Object.keys(counts).map(function(k){return counts[k];});
  list.sort(function(a,b){
    return CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat)||a.name.localeCompare(b.name);});
  return list;
}
function listText(list){
  var p=P(),byCat={};
  list.forEach(function(it){(byCat[it.cat]=byCat[it.cat]||[]).push(it);});
  var out=WN[state.week]+" — "+p.short+" — SHOPPING LIST\n";
  CAT_ORDER.forEach(function(c){
    if(!byCat[c])return;
    out+="\n"+CAT_LABEL[c].toUpperCase()+"\n";
    byCat[c].forEach(function(it){
      out+="  ✓ "+it.name+" ("+it.amt+(it.times>1?" ×"+it.times:"")+")\n";});
  });
  if(p.suppsNote)out+="\n"+p.suppsNote+"\n";
  out+="\nPlan: "+PHONE_URL;
  return out;
}

/* ---------- sheet ---------- */
function openSheet(){
  var list=aggregate(),byCat={},html="";
  list.forEach(function(it){(byCat[it.cat]=byCat[it.cat]||[]).push(it);});
  q("#shSub").textContent=WN[state.week]+" · "+P().short+" — "+list.length+" items. Tick meals back on the page to adjust.";
  CAT_ORDER.forEach(function(c){
    if(!byCat[c])return;
    html+='<div class="cat">'+CAT_LABEL[c]+'</div>';
    byCat[c].forEach(function(it){
      html+='<div class="ritem"><span>'+iconForItem(it)+'</span><span><b>'+esc(it.name)+
        '</b></span><span class="rq">'+esc(it.amt)+(it.times>1?" ×"+it.times:"")+'</span></div>';});
  });
  if(!html)html='<p class="sub">Nothing selected — tap meals or a day header to include them.</p>';
  q("#shList").innerHTML=html;
  q("#ov").classList.add("open");
}
function closeSheet(){q("#ov").classList.remove("open");}

/* ---------- supplements sheet ---------- */
function loadTicks(){
  try{ticks=JSON.parse(localStorage.getItem("mp-ticks-"+todayKey())||"{}");}catch(e){ticks={};}
  if(window.__remoteState&&window.__remoteState.day===todayKey()&&window.__remoteState.ticks){
    var r=window.__remoteState.ticks, merged={};
    Object.keys(r).forEach(function(k){merged[k]=true;});
    Object.keys(ticks).forEach(function(k){merged[k]=true;});
    ticks=merged;
  }
}
fetch("/state").then(function(r){return r.json();}).then(function(st){window.__remoteState=st;}).catch(function(){});
function openSupps(){
  loadTicks();
  var D=window.MEAL_DATA, g=(D.suppGroups&&D.suppGroups.length)?D.suppGroups:(P().suppGuide||[]);
  var teas=D.teas||[];
  if(teas.length){
    html='';
    var thtml='<div class="sgroup">Teas (between meals)</div>';
    teas.forEach(function(t){
      thtml+='<div class="srow" data-k="tea:'+t.name+'"><span class="tick"></span><span><b>'+esc(t.name)+
        '</b> <span class="when">'+esc(t.when)+'</span><br><span class="why">'+esc(t.amt+' — '+t.why)+'</span></span></div>';
    });
    html+=thtml;
  }
  var rituals=D.rituals||[];
  if(rituals.length){
    html+='<div class="sgroup">Daily rituals</div>';
    rituals.forEach(function(r){
      html+='<div class="srow" data-k="rit:'+r.name+'"><span class="tick"></span><span><b>'+esc(r.name)+'</b> <span class="when">'+esc(r.when)+'</span>'
        +'<br><span class="why">'+esc(r.text||r.why||'')+(r.note?' '+esc(r.note):'')+'</span></span></div>';
    });
  }
  g.forEach(function(grp){
    html+='<div class="sgroup">'+esc(grp.group)+(grp.kind==='phase'?' <span class="badge phase">protocol phase</span>':' <span class="badge daily">daily</span>')+'</div>';
    (grp.items||[]).forEach(function(it){
      var isPhase=grp.kind==='phase';
      html+='<div class="srow'+(isPhase?' phaserow':'')+'"'+(isPhase?'':' data-k="supp:'+it[0]+'"')+'><span class="tick"></span><span><b>'+esc(it[0])+'</b> <span class="when">'+esc(it[2])+'</span>'
        +'<br><span class="why">'+esc(it[3])+'</span></span>'
        +'<span class="dose">'+esc(it[1])+'</span></div>';
    });
  });
  if(P().suppsNote) html+='<p class="snote">'+esc(P().suppsNote)+'</p>';
  q("#shList").innerHTML=html;
  wireTicks();
  q("#shTitle").textContent="Supplements — "+P().short+" protocol";
  q("#shSub").textContent="Tick the daily ones as you take them. Phase-tagged items are managed by the protocol — greyed until active.";
  q("#ov").classList.add("open");
  return;
  /* legacy renderer kept below for fallback */
  var p=P(), g2=p.suppGuide||[];
  q("#shTitle").textContent="Supplements — "+p.short+" protocol";
  q("#shSub").textContent="Complete guide: what, dose, timing and why. Per-meal reminders also appear on each meal card.";
  var html="";
  g.forEach(function(grp){
    html+='<div class="sgroup">'+esc(grp.group)+'</div>';
    grp.items.forEach(function(it){
      html+='<div class="srow"><span><b>'+esc(it[0])+'</b> <span class="when">'+esc(it[2])+'</span>'
        +'<br><span class="why">'+esc(it[3])+'</span></span>'
        +'<span class="dose">'+esc(it[1])+'</span></div>';
    });
  });
  if(p.suppsNote) html+='<p class="snote">'+esc(p.suppsNote)+'</p>';
  if(!g.length) html='<p class="snote">No supplement protocol for this plan — it is the whole-food break, not the healing protocol.</p>';
  q("#shList").innerHTML=html;
  q("#ov").classList.add("open");
}
q("#suppBtn").onclick=openSupps;

/* ---------- routines sheet ---------- */
function openRoutines(){
  loadTicks();
  var D=window.MEAL_DATA, html='';
  (D.routines||[]).forEach(function(grp){
    html+='<div class="sgroup">'+esc(grp.group)+'</div>';
    (grp.items||[]).forEach(function(it){

  q("#ov").classList.add("open");

q("#routBtn").onclick=openRoutines;

/* ---------- check-off persistence (cross-device via /state when available) ---------- */
var ticks={};
try{ticks=JSON.parse(localStorage.getItem("mp-ticks")||"{}");}catch(e){}
function saveTicks(){
  localStorage.setItem("mp-ticks-"+todayKey(), JSON.stringify(ticks));
  if(window.__stateSave) window.__stateSave({ticks:ticks, day:todayKey()});
}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
window.__stateSave=function(obj){
  try{fetch("/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});}catch(e){}
};
window.__stateLoad=function(cb){
  try{fetch("/state").then(function(r){return r.json();}).then(function(st){if(st&&st.ticks)window.__remoteState=st;}).catch(function(){});}catch(e){}
};
function wireTicks(){
  q("#shList").querySelectorAll(".srow[data-k]").forEach(function(row){
    var k=row.getAttribute("data-k");
    if(ticks[k])row.classList.add("done");
    row.onclick=function(){
      var on=!row.classList.contains("done");
      row.classList.toggle("done",on);
      if(on)ticks[k]=true;else delete ticks[k];
      saveTicks();
    };
  });
}

/* ---------- actions ---------- */
q("#bAll").onclick=function(){var a=inclArr();for(var i=0;i<a.length;i++)a[i]=true;save();renderDays();updateCounts();};
q("#bNone").onclick=function(){var a=inclArr();for(var i=0;i<a.length;i++)a[i]=false;save();renderDays();updateCounts();};
q("#bReset").onclick=function(){delete state.incl[key()];save();renderDays();updateCounts();};
q("#bList").onclick=openSheet;
q("#shX").onclick=closeSheet;
q("#ov").onclick=function(e){if(e.target===q("#ov"))closeSheet();};
q("#shCopy").onclick=function(){
  var t=listText(aggregate());
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("Copied ✓");});
  }else{
    var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");ta.remove();toast("Copied ✓");
  }
};
q("#shPrint").onclick=function(){window.print();};
function sendTG(){
  var t=listText(aggregate());
  fetch("/telegram",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:t})})
    .then(function(r){return r.json();})
    .then(function(j){toast(j.ok?"Sent to Telegram ✓":"Send failed: "+(j.error||"?"));})
    .catch(function(e){toast("Send failed: "+e);});
}
q("#bSend").onclick=sendTG;
q("#shSend").onclick=sendTG;
if(navigator.share){
  var doShare=function(){
    var t=listText(aggregate());
    navigator.share({title:"Shopping list — "+WN[state.week],text:t}).catch(function(){});
  };
  q("#bShare").style.display="";q("#shShare").style.display="";
  q("#bShare").onclick=doShare;q("#shShare").onclick=doShare;
}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});

renderAll();
